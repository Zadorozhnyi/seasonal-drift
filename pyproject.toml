[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdrift"
version = "0.1.0"
description = "Seasonality-aware drift detection on time series: MVP experiments"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "statsmodels",
    "river==0.22.0",
    "matplotlib",
    "pyarrow",
    "tabulate",
]

[tool.setuptools.packages.find]
where = ["src"]
